name: Challenge an LST Position
description: Submit a biblical challenge to LST's current wording, doctrine, or confidence level.
title: "[LST Challenge] "
labels:
  - challenge
body:
  - type: markdown
    attributes:
      value: |
        Anyone may challenge LST. You may write your own argument or use your favorite AI. No AI preliminary verdict can block your submission.

        **One argument, five elements:** (1) the exact current LST claim; (2) the problem; (3) the Scripture passages and contextual reasoning; (4) the correction you propose; (5) what biblical evidence might change your mind.

        Do not post private data. An issue is public. Review may require clarification and has **no guaranteed intake deadline**. The current public rules, including three substantive rebuttal rounds and seven-day post-adjudication windows, are in [Contributing](https://github.com/kenkibbey/living-systematic-theology/blob/main/CONTRIBUTING.md). The separate four-AI independent review is a **pilot, not yet adopted**.
  - type: textarea
    id: challenge
    attributes:
      label: Your complete biblical challenge
      description: Write one coherent case with the five elements above. Cite the biblical texts and explain their context.
      placeholder: |
        Current claim:
        What I challenge:
        Biblical argument:
        Suggested correction:
        Evidence that would change my mind:
    validations:
      required: true
