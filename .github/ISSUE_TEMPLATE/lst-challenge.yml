name: Challenge an LST Position
description: Submit a biblical challenge to a doctrine, interpretation, confidence level, or argument in Living Systematic Theology.
title: "[LST Challenge] "
labels:
  - challenge
body:
  - type: markdown
    attributes:
      value: |
        Living Systematic Theology welcomes serious biblical challenges.

        You do not need to agree with LST, belong to a particular tradition, or be a theologian.

        The purpose of this issue is simple: identify something you believe LST gets wrong, overstates, understates, or has not adequately demonstrated, and show why from Scripture.

        Opening an issue does not automatically mean LST should change. Every challenge should be tested against Scripture, including the strongest biblical case for retaining the current position.

        If Scripture requires correction, LST should change. If the challenge fails, the present position may stand or be strengthened.

        Challenges receive a public disposition: Sustained, Partially Sustained, Not Sustained, or Unresolved. The final issue response will explain whether LST changed and why.

  - type: textarea
    id: position
    attributes:
      label: What LST position are you challenging?
      description: Quote the sentence if possible, or identify the doctrine or chapter.
      placeholder: Identify the exact LST claim you want examined.
    validations:
      required: true

  - type: textarea
    id: objection
    attributes:
      label: What do you believe LST has wrong?
      description: Explain your objection in your own words.
      placeholder: Explain where you believe LST has overstated, understated, misunderstood, or failed to demonstrate something.
    validations:
      required: true

  - type: textarea
    id: scripture
    attributes:
      label: Which Scripture passage or passages make your strongest case?
      description: Give the references and explain how you believe they challenge the LST position.
      placeholder: List the passages and explain the argument from them.
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: What do you believe LST should say instead?
      description: You do not need perfect wording. Explain the conclusion you believe Scripture requires.
      placeholder: State the position you believe better fits Scripture.
    validations:
      required: true

  - type: textarea
    id: falsification
    attributes:
      label: What would convince you that the current LST position should remain?
      description: This helps make the challenge testable rather than simply placing two opinions beside one another.
      placeholder: What biblical evidence or argument would change your mind?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Please argue from Scripture rather than theological labels alone.

        You are welcome to explain how Calvinism, Arminianism, Dispensationalism, Covenant Theology, Catholicism, Orthodoxy, or another tradition understands the issue, but the tradition itself is not the final argument.

        Scripture is.
