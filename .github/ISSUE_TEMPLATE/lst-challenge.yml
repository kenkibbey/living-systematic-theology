name: Challenge an LST Position
description: Submit a biblical challenge to LST's current wording, doctrine, or confidence level.
title: "[LST Challenge] "
labels:
  - challenge
body:
  - type: markdown
    attributes:
      value: |
        Anyone may challenge LST. You may write your own argument or use your favorite AI. No AI preliminary verdict can block your submission.

        **One argument, five elements:** (1) the exact current LST claim; (2) the problem; (3) the Scripture passages and contextual reasoning; (4) the correction you propose; (5) what biblical evidence might change your mind.

        Do not post private data. An issue is public. Substantive challenges remain **open and unlocked by default** as continuing topic records. Any contributor may add relevant arguments, evidence, corrections, sources, or questions without a fixed reply limit or response deadline. Review may require clarification or be deferred; there is **no guaranteed immediate response**. The maintained position, verdict or review status, evidence, and unresolved questions are separate from GitHub open/closed state.

        Search for related issues and contribute to the existing topic when appropriate; link a genuinely distinct challenge. Duplicates are checked for distinct contributions before redirection. Human intake, Revision Resistance, and owner approval for substantive revisions apply. See [Contributing](https://github.com/kenkibbey/living-systematic-theology/blob/main/CONTRIBUTING.md#continuing-review-and-issue-status) for continuing review, administrative exceptions, and moderation. Participation counts prove no doctrine. The separate four-AI independent review is a **pilot, not yet adopted**.
  - type: textarea
    id: challenge
    attributes:
      label: Your complete biblical challenge
      description: Write one coherent case with the five elements above. Cite the biblical texts and explain their context.
      placeholder: |
        Current claim:
        What I challenge:
        Biblical argument:
        Suggested correction:
        Evidence that would change my mind:
    validations:
      required: true
