title: Living Systematic Theology
description: A Christ-centered, Scripture-governed, continuously reforming systematic theology
theme: minima
url: https://kenkibbey.github.io
baseurl: /living-systematic-theology
markdown: kramdown
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
exclude:
  - node_modules
  - vendor
  - .github

# Keep GitHub Mobile Markdown free of visible YAML metadata while allowing
# Jekyll Pages to assign a layout to chapter presentation pages.
defaults:
  - scope:
      path: "THEOLOGY/CHAPTERS"
      type: "pages"
    values:
      layout: "page"
